<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사이트맵 편집기 C · 테스트판 (점핑클럽)</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--panel-2:#fbfbfe;--ink:#191622;--ink-2:#4a4860;--muted:#8b89a3;--line:#e7e7f0;--line-2:#eff0f6;--accent:#5b57e0;--accent-ink:#fff;--accent-soft:#edecfd;--accent-soft-ink:#3e39b8;--good:#128a6b;--danger:#c0344a;--chip:#f1f1f8;--chip-ink:#5a5873;--shadow:0 1px 2px rgba(20,18,40,.05),0 10px 28px -16px rgba(20,18,40,.22);--home:#0f8f8a;--home-soft:#e2f4f2;--child:#8a6bd0;--child-soft:#efe9fb;--sans:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f15;--panel:#191922;--panel-2:#1f1f2b;--ink:#f0eff7;--ink-2:#c3c1d6;--muted:#8d8ba6;--line:#2b2b38;--line-2:#24242f;--accent:#8b86ff;--accent-ink:#13121c;--accent-soft:#272549;--accent-soft-ink:#c8c4ff;--good:#4fd3a9;--danger:#f0718a;--chip:#24242f;--chip-ink:#b7b5cc;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -18px rgba(0,0,0,.75);--home:#52d6cf;--home-soft:#16302e;--child:#b49cf0;--child-soft:#231f3a}}
:root[data-theme=dark]{--bg:#0f0f15;--panel:#191922;--panel-2:#1f1f2b;--ink:#f0eff7;--ink-2:#c3c1d6;--muted:#8d8ba6;--line:#2b2b38;--line-2:#24242f;--accent:#8b86ff;--accent-ink:#13121c;--accent-soft:#272549;--accent-soft-ink:#c8c4ff;--good:#4fd3a9;--danger:#f0718a;--chip:#24242f;--chip-ink:#b7b5cc;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -18px rgba(0,0,0,.75);--home:#52d6cf;--home-soft:#16302e;--child:#b49cf0;--child-soft:#231f3a}
:root[data-theme=light]{--bg:#f6f7fb;--panel:#fff;--panel-2:#fbfbfe;--ink:#191622;--ink-2:#4a4860;--muted:#8b89a3;--line:#e7e7f0;--line-2:#eff0f6;--accent:#5b57e0;--accent-ink:#fff;--accent-soft:#edecfd;--accent-soft-ink:#3e39b8;--good:#128a6b;--danger:#c0344a;--chip:#f1f1f8;--chip-ink:#5a5873;--shadow:0 1px 2px rgba(20,18,40,.05),0 10px 28px -16px rgba(20,18,40,.22);--home:#0f8f8a;--home-soft:#e2f4f2;--child:#8a6bd0;--child-soft:#efe9fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5}
svg.i{width:17px;height:17px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block}svg.i.sm{width:15px;height:15px}
.wrap{max-width:1040px;margin:0 auto;padding:26px clamp(14px,3vw,30px) 70px}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.phead .badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-soft-ink);font-size:12px;font-weight:700;border-radius:999px;padding:4px 11px}
.phead h2{font-size:clamp(20px,2.4vw,26px);letter-spacing:-.02em;margin:10px 0 4px;text-wrap:balance}
.phead .lede{margin:0;color:var(--ink-2);font-size:14px;max-width:60ch}
.themebtn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);border-radius:9px;padding:7px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
/* 트리 */
.tree{padding:6px}
.trow{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:11px;margin:2px 0;font-size:14px;cursor:pointer;border:1px solid transparent;transition:background .12s,border-color .12s}
.trow:hover{background:var(--panel-2)}
.trow.sel{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.trow.home{background:var(--home-soft)}
.trow.home.sel{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--home) 45%,transparent)}
.trow.child{margin-left:30px}
.trow .tn{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.home .tn{font-weight:700}
.trow .tico{color:var(--muted);display:grid;place-items:center}.trow .tico.hm{color:var(--home)}.trow .tico.top{color:var(--accent)}
.trow .tc{font-size:11.5px;color:var(--muted)}
.trow .spacer{flex:1}
.grip{color:var(--muted);cursor:grab;display:grid;place-items:center}
.pill-home{background:#ffffff55;color:var(--home);font-weight:700;border-radius:999px;font-size:11px;padding:2px 9px}
:root[data-theme=dark] .pill-home,@media (prefers-color-scheme:dark){.pill-home{background:#0003}}
.pill-sub{background:var(--child-soft);color:var(--child);font-weight:700;border-radius:999px;font-size:10.5px;padding:2px 8px}
.ibtn{width:28px;height:28px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.12s}
.ibtn:hover{background:var(--panel);border-color:var(--line);color:var(--ink)}
.ibtn.danger:hover{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.ibtn.sm2{width:26px;height:26px}
.cv{width:28px;height:28px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.15s}
.cv:hover{background:var(--panel);border-color:var(--line)}.cv.op{transform:rotate(180deg)}
.eye{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.12s}
.eye:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.eye.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tgroup{margin:0 0 4px}
.addrow{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--accent);font-size:13px;font-weight:600;border:1.5px dashed color-mix(in srgb,var(--accent) 32%,var(--line));border-radius:11px;padding:9px;cursor:pointer;background:none;width:100%;font-family:inherit;margin-top:4px}
.addrow:hover{background:var(--accent-soft)}
.addsub{color:var(--child);border-color:color-mix(in srgb,var(--child) 38%,var(--line));font-size:12px;padding:7px;margin-left:30px;width:calc(100% - 30px)}
.addsub:hover{background:var(--child-soft)}
[contenteditable]{outline:none}[contenteditable]:focus{box-shadow:0 1px 0 var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:11.5px;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:3px 9px;white-space:nowrap}
/* 미리보기 */
.pv-nav{display:flex;align-items:center;gap:3px;flex-wrap:wrap;padding:11px 13px;background:var(--panel-2);border-bottom:1px solid var(--line-2)}
.pv-logo{font-weight:800;letter-spacing:-.02em;margin-right:9px;color:var(--accent)}
.pv-mwrap{position:relative}
.pv-mi{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.pv-mi:hover{background:var(--panel);border-color:var(--line)}
.pv-mi.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.pv-mi.hm{color:var(--home)}.pv-mi.hm.on{color:var(--accent-ink)}
.pv-ca{color:currentColor;opacity:.7}
.pv-mwrap:hover .pv-dd{display:block}
.pv-dd{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:9;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:170px;padding:5px}
.pv-di{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:7px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.pv-di:hover{background:var(--child-soft);color:var(--child)}
.pv-di.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.pv-canvas{padding:15px;background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 10px,transparent 10px,transparent 20px)}
.pv-canvas.big{min-height:52vh}
.pv-pagebar{font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600}
.pv-wire{background:var(--panel);border:1px dashed var(--line);border-radius:9px;padding:13px 14px;margin-bottom:8px;font-size:13px;display:flex;align-items:center;gap:9px}
.pv-wire b{font-weight:650}.pv-wire .pv-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}.pv-wire .pv-tag{margin-left:auto;font-size:11px;color:var(--muted)}
/* 버튼/푸터 */
.act-primary{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:650;cursor:pointer;font-family:inherit}
.act-ghost{display:inline-flex;align-items:center;gap:6px;background:none;color:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.footbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.footbar .hint{font-size:12.5px;color:var(--muted)}
@font-face{font-family:'Pretendard';font-weight:45 920;font-style:normal;font-display:swap;src:url('PretendardVariable.woff2') format('woff2-variations');}
:root{--sans:"Pretendard","Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.trow{user-select:none;position:relative}
.trow .tn{user-select:text}
.trow.dragging{opacity:.4}
.trow.drop-b{box-shadow:inset 0 3px 0 var(--accent)}
.trow.drop-a{box-shadow:inset 0 -3px 0 var(--accent)}
.trow.drop-in{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.pill-cnt{font-size:10.5px;color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 8px;font-weight:600}
.grip{touch-action:none}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;margin:0 8px 6px 8px}
.seg button{border:none;background:none;font-family:inherit;font-size:13.5px;font-weight:650;color:var(--ink-2);padding:8px 16px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.segbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 6px 2px;flex-wrap:wrap}
.segbar .note{font-size:12px;color:var(--muted);padding-right:8px}
.pane{display:none}.pane.on{display:block}
.pane-edit{padding:6px}
.pvframe{margin:6px;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.tiphint{margin:2px 8px 10px;font-size:12px;color:var(--muted);line-height:1.5;background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;padding:9px 12px}
.tiphint b{color:var(--ink-2)}
/* 추가 버튼: 점선 테두리·호버배경 제거, 평소 회색→호버 브랜드색, + 는 원형 실선 안 */
.addrow{border:none !important;background:none !important;color:var(--muted);justify-content:flex-start;gap:9px;padding:8px 12px;font-weight:600}
.addrow:hover{background:none !important;color:var(--accent)}
.addrow.addsub{color:var(--muted)}
.addrow.addsub:hover{background:none !important;color:var(--child)}
.addrow .addcirc{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;flex:0 0 auto}
.addrow .addcirc svg.i{width:12px;height:12px;stroke-width:2.2}
/* 세그바 왼쪽 정렬 + 도움말 */
.segbar{justify-content:flex-start}
.segleft{display:flex;align-items:center;gap:12px}
.helpwrap{position:relative;display:inline-flex}
.helpbtn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);font-weight:800;font-size:13px;cursor:help;display:grid;place-items:center;font-family:inherit;line-height:1}
.helpbtn:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.helpbox{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:30;width:min(400px,82vw);background:#fff;color:#4a4860;border:1px solid #e7e7f0;border-radius:12px;box-shadow:0 10px 30px -10px rgba(20,18,40,.28);padding:14px 16px;font-size:12.5px;line-height:1.65;font-weight:400}
.helpbox b{color:#191622;font-weight:700}
.helpwrap:hover .helpbox,.helpbtn:focus + .helpbox{display:block}
/* 홈 행: 흰 배경 + 아이콘·글자 브랜드색 */
.trow.home:not(.sel){background:none}
.trow.home.sel{box-shadow:none}
.trow.home .tico.hm{color:var(--accent)}
.trow.home .tn{color:var(--accent);font-weight:700}
/* 선택 행: 테두리색=배경색(블렌드) */
.trow.sel{border-color:var(--accent-soft)}
/* 트리 페이지 아이콘 색 = 그립과 동일(회색) */
.trow .tico.top{color:var(--muted)}
/* 탭: 동일 폭 + 아이콘 없이 가운데 정렬 */
.seg{display:flex;width:260px;max-width:100%}
.seg button{flex:1 1 0;justify-content:center;text-align:center;gap:0;padding:8px 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="phead">
    <div><span class="badge">4단계 · 메뉴 구성</span><h2>C. 편집 ⇄ 미리보기 — 테스트판</h2><p class="lede">우리 서비스 폰트(Pretendard)로. 메뉴를 자유롭게 끌어 계층을 바꾸고, 추가·삭제·이름수정이 실제로 동작합니다. 미리보기 탭에서 결과를 바로 확인하세요.</p></div>
    <button class="themebtn" id="themebtn">◐ 라이트/다크</button>
  </div>
  <div class="card">
    <div class="segbar">
      <div class="segleft">
        <div class="helpwrap">
          <button class="helpbtn" aria-label="사용 방법 안내">?</button>
          <div class="helpbox"><b>사용 방법</b><br>⠿ 아이콘을 잡고 끌어 옮깁니다. <b>줄의 위/아래</b>에 놓으면 같은 줄의 형제로, <b>줄의 가운데</b>에 놓으면 그 메뉴의 <b>하위로</b> 들어갑니다. 상위를 다른 상위의 하위로 넣으면 그 하위들도 함께 따라가고, 하위를 꺼내 상위로 올릴 수도 있어요. 이름은 클릭해 바로 수정.</div>
        </div>
        <div class="seg"><button id="tabEdit" class="on">편집</button><button id="tabPrev">미리보기</button></div>
      </div>
    </div>
    <div class="pane pane-edit on" id="paneEdit"><div class="tree" id="tree"></div></div>
    <div class="pane" id="panePrev"><div class="pvframe" id="pv"></div></div>
  </div>
  <div id="footmount"></div>
</div>
<script>
/* ===== 인터랙티브 코어: 재귀 트리 + 계층 넘나드는 드래그앤드롭 + 추가/삭제/이름수정 ===== */
const I={
  home:'<svg class="i" viewBox="0 0 24 24"><path d="M3.6 11.3 12 4.5l8.4 6.8"/><path d="M5.5 10v8.5a1 1 0 0 0 1 1H10v-5.3h4v5.3h3.5a1 1 0 0 0 1-1V10"/></svg>',
  page:'<svg class="i" viewBox="0 0 24 24"><path d="M7 3.5h6.2L18 8.2V19a1.3 1.3 0 0 1-1.3 1.3H7A1.3 1.3 0 0 1 5.7 19V4.8A1.3 1.3 0 0 1 7 3.5z"/><path d="M12.9 3.7V8.4h4.7"/><path d="M8.7 12.8h6.6M8.7 16h4.2"/></svg>',
  grip:'<svg class="i sm" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>',
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg class="i sm" viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M10 4.6h4a1 1 0 0 1 1 1V7H9V5.6a1 1 0 0 1 1-1z"/><path d="M6.8 7l.8 11.4A1.6 1.6 0 0 0 9.2 20h5.6a1.6 1.6 0 0 0 1.6-1.5L17.2 7"/><path d="M10.4 10.5v5.5M13.6 10.5v5.5"/></svg>',
  down:'<svg class="i sm" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  eye:'<svg class="i sm" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  arrow:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  left:'<svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
};
const SEC={hero:'히어로',feature:'강점·특징',stats:'성과 지표',product:'상품',news:'소식·공지',cta:'행동 유도',recruit:'모집 안내',process:'진행 절차',faq:'자주 묻는 질문',about:'소개',service:'과정·서비스',category:'카테고리',pdp:'상품 상세',detailImages:'상세 이미지',cart:'장바구니',gallery:'갤러리',contact:'문의·연락'};
const secLabel=s=>SEC[s]||s;
let _uid=100;const uid=p=>`${p||'pg'}-${++_uid}`;
let TREE=[
 {id:'home',title:'홈',home:true,purpose:'협회·가맹·단과수업·용품·소식을 한눈에 요약해, 처음 온 방문자를 가맹 상담과 상품 구매로 안내하는 첫 화면',sections:['hero','feature','stats','product','news','cta']},
 {id:'franchise',title:'점핑클럽 교육관 모집',purpose:'체육관 관장이 가맹의 혜택·지원·절차를 확인하고 가맹 상담을 신청하도록 이끄는 핵심 랜딩',sections:['hero','recruit','feature','cta'],children:[
   {id:'fr-benefit',title:'가맹 혜택·지원',purpose:'가맹 시 받는 교육·마케팅·운영 지원 혜택을 정리해 관장의 결심을 돕는 안내',sections:['feature','stats','cta']},
   {id:'fr-process',title:'가맹 절차·상담',purpose:'상담→계약→교육→오픈까지 가맹 진행 단계와 상담 신청을 안내',sections:['process','faq','contact']},
 ]},
 {id:'about',title:'협회 소개',purpose:'협회의 설립 취지·사명과 200개 교육관 운영 규모를 전달해 신뢰를 쌓는 소개',sections:['about','feature','stats','cta']},
 {id:'education',title:'자격연수·지도자교육',purpose:'자격연수·지도자교육 과정을 안내해 지도자 지망생이 신청·문의로 이어지게 하는 교육 허브',sections:['service','process','cta'],children:[

const HOME=()=>TREE[0];
const tops=()=>TREE.filter(p=>!p.home);
const kids=p=>(p.children||(p.children=[]));
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

/* --- 트리 탐색/이동 유틸 --- */
function locate(id,arr,parent){arr=arr||TREE;for(let i=0;i<arr.length;i++){const n=arr[i];if(n.id===id)return{arr,index:i,parent:parent||null,node:n};if(n.children){const r=locate(id,n.children,n);if(r)return r;}}return null;}
function find(id){const l=locate(id);return{p:l?l.node:HOME(),par:l?l.parent:null};}
function isDescendant(ancId,nodeId){const l=locate(ancId);if(!l)return false;const walk=n=>{if(n.id===nodeId)return true;return(n.children||[]).some(walk);};return(l.node.children||[]).some(walk);}
function detach(id){const l=locate(id);if(!l)return null;return l.arr.splice(l.index,1)[0];}

/* --- 변경 연산 --- */
function addTop(st,rerender){const np={id:uid('top'),title:'새 메뉴',purpose:'이 페이지에 담을 내용을 적어 주세요',sections:['hero','cta']};TREE.push(np);st.sel=np.id;rerender(np.id);}
function addChild(parentId,st,rerender){const par=find(parentId).p;const np={id:uid('sub'),title:'새 하위 메뉴',purpose:'이 하위 페이지에 담을 내용을 적어 주세요',sections:['cta']};kids(par).push(np);st.open[parentId]=true;st.sel=np.id;rerender(np.id);}
function delPage(id,st,rerender){const l=locate(id);if(!l||l.node.home)return;if(st.sel===id)st.sel=l.parent?l.parent.id:'home';l.arr.splice(l.index,1);rerender();}
function renamePage(id,title){const t=title.trim();if(!t)return false;find(id).p.title=t;return true;}
/* 계층 넘나드는 이동: zone='before'|'after'(형제) | 'inside'(그 안의 하위로). 자기 자손으로는 못 감. 홈은 고정. */
function moveNode(dragId,targetId,zone){
  if(dragId===targetId)return;
  const tl=locate(targetId);if(!tl)return;
  if(tl.node.home&&zone!=='after')return;          // 홈 안으로/홈 앞으로는 금지(홈은 첫 화면 고정)
  if(isDescendant(dragId,targetId))return;          // 자기 자손 안으로 이동 금지(순환 방지)
  const node=detach(dragId);if(!node)return;
  if(zone==='inside'){(tl.node.children||(tl.node.children=[])).push(node);}
  else{const t2=locate(targetId);t2.arr.splice(zone==='after'?t2.index+1:t2.index,0,node);}
}

let DRAG=null;
function selectText(node){const r=document.createRange();r.selectNodeContents(node);const s=getSelection();s.removeAllRanges();s.addRange(r);}

function renderTree(mount, st, rerender){
  mount.innerHTML='';
  const eye=id=>`<button class="eye${st.sel===id?' on':''}" title="이 페이지 미리보기">${I.eye}</button>`;
  const clearDrops=()=>mount.querySelectorAll('.drop-b,.drop-a,.drop-in').forEach(n=>n.classList.remove('drop-b','drop-a','drop-in'));
  const zoneOf=(row,e)=>{const rc=row.getBoundingClientRect();const y=e.clientY-rc.top,h=rc.height;if(row.dataset.home==='1')return 'after';if(y<h*0.3)return 'before';if(y>h*0.7)return 'after';return 'inside';};
  const bindRow=(row,node,depth)=>{
    // 이름 수정
    const tn=row.querySelector('.tn');
    if(tn.isContentEditable!==false&&tn.getAttribute('contenteditable')!==null){
      tn.addEventListener('blur',()=>{if(!renamePage(node.id,tn.textContent))tn.textContent=find(node.id).p.title;rerender();});
      tn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tn.blur();}});
    }
    // 선택
    row.addEventListener('click',e=>{if(e.target.closest('.cv')||e.target.closest('.ibtn')||e.target.closest('.eye')||e.target.isContentEditable)return;st.sel=node.id;rerender();});
    const eyeBtn=row.querySelector('.eye');if(eyeBtn)eyeBtn.addEventListener('click',e=>{e.stopPropagation();st.sel=node.id;if(st.onEye)st.onEye(node.id);rerender();});
    const cv=row.querySelector('.cv');if(cv)cv.addEventListener('click',e=>{e.stopPropagation();st.open[node.id]=!st.open[node.id];rerender();});
    const del=row.querySelector('.ibtn.danger');if(del)del.addEventListener('click',e=>{e.stopPropagation();delPage(node.id,st,rerender);});
    // 드래그(그립으로만 시작) — 홈 제외
    const grip=row.querySelector('.grip');
    if(grip){
      grip.addEventListener('mousedown',()=>{row.draggable=true;});
      grip.addEventListener('touchstart',()=>{row.draggable=true;},{passive:true});
      row.addEventListener('dragstart',e=>{DRAG={id:node.id};row.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',node.id);});
      row.addEventListener('dragend',()=>{row.draggable=false;row.classList.remove('dragging');clearDrops();DRAG=null;});
    }
    // 드롭 대상(모든 행)
    const canDrop=()=>DRAG&&DRAG.id!==node.id&&!isDescendant(DRAG.id,node.id);
    row.addEventListener('dragover',e=>{if(!canDrop())return;const z=zoneOf(row,e);if(node.home&&z!=='after')return;e.preventDefault();clearDrops();row.classList.add(z==='inside'?'drop-in':z==='after'?'drop-a':'drop-b');});
    row.addEventListener('dragleave',e=>{if(!row.contains(e.relatedTarget))row.classList.remove('drop-b','drop-a','drop-in');});
    row.addEventListener('drop',e=>{if(!canDrop())return;const z=zoneOf(row,e);if(node.home&&z!=='after')return;e.preventDefault();clearDrops();moveNode(DRAG.id,node.id,z);if(z==='inside')st.open[node.id]=true;DRAG=null;rerender();});
  };
  const renderNode=(node,depth)=>{
    const home=!!node.home, open=!!st.open[node.id], hasK=(node.children||[]).length>0;
    const row=el('div','trow'+(depth>0?' child':'')+(home?' home':'')+(st.sel===node.id?' sel':''));
    row.dataset.id=node.id;if(home)row.dataset.home='1';
    row.style.marginLeft=(depth*24)+'px';
    row.innerHTML=`${home?`<span class="tico hm">${I.home}</span>`:`<span class="grip" title="드래그해서 이동 (위/아래=형제, 가운데=하위로)">${I.grip}</span><span class="tico top">${I.page}</span>`}`
      +`<span class="tn"${home?'':' contenteditable spellcheck="false"'}>${esc(node.title)}</span>`
      +`${home?'<span class="pill-home">첫 화면</span>':''}`
      +`<span class="spacer"></span>`
      +`${hasK?`<button class="cv${open?' op':''}" title="하위 펼치기">${I.down}</button>`:''}`
      +`${home?'':`<button class="ibtn danger sm2" title="삭제">${I.trash}</button>`}`;
    mount.appendChild(row);
    bindRow(row,node,depth);
    if(hasK&&open){
      node.children.forEach(c=>renderNode(c,depth+1));
      const addK=el('button','addrow addsub',`<span class="addcirc">${I.plus}</span> 하위 페이지 추가`);addK.style.marginLeft=((depth+1)*24)+'px';addK.style.width=`calc(100% - ${(depth+1)*24}px)`;addK.onclick=()=>addChild(node.id,st,rerender);mount.appendChild(addK);
    }else if(!home&&open&&!hasK){
      const addK=el('button','addrow addsub',`<span class="addcirc">${I.plus}</span> 하위 페이지 추가`);addK.style.marginLeft=((depth+1)*24)+'px';addK.style.width=`calc(100% - ${(depth+1)*24}px)`;addK.onclick=()=>addChild(node.id,st,rerender);mount.appendChild(addK);
    }
  };
  TREE.forEach(n=>renderNode(n,0));
  const addT=el('button','addrow',`<span class="addcirc">${I.plus}</span> 상위 페이지 추가`);addT.onclick=()=>addTop(st,rerender);mount.appendChild(addT);
}

/* 미리보기 — 상단 메뉴바(하위는 드롭다운, 더 깊으면 들여써서 표시). nav 클릭=선택. */
function renderPreview(mount, st, rerender){
  const{p}=find(st.sel);
  const nav=el('div','pv-nav');nav.innerHTML='<span class="pv-logo">점핑클럽</span>';
  const ddItems=(node,depth,dd)=>{(node.children||[]).forEach(k=>{const di=el('div','pv-di'+(st.sel===k.id?' on':''));di.style.paddingLeft=(10+depth*14)+'px';di.innerHTML=`${esc(k.title)}`;di.onclick=()=>{st.sel=k.id;rerender();};dd.appendChild(di);ddItems(k,depth+1,dd);});};
  const mkItem=(pg,isHome)=>{
    const wrap=el('div','pv-mwrap');
    wrap.innerHTML=`<span class="pv-mi${st.sel===pg.id?' on':''}${isHome?' hm':''}">${isHome?I.home:''}<span>${esc(pg.title)}</span>${(pg.children||[]).length?`<span class="pv-ca">${I.down}</span>`:''}</span>`;
    wrap.querySelector('.pv-mi').onclick=()=>{st.sel=pg.id;rerender();};
    if((pg.children||[]).length){const dd=el('div','pv-dd');ddItems(pg,0,dd);wrap.appendChild(dd);}
    return wrap;
  };
  nav.appendChild(mkItem(HOME(),true));tops().forEach(pg=>nav.appendChild(mkItem(pg,false)));
  const cv=el('div','pv-canvas big');
  cv.innerHTML=`<div class="pv-pagebar">${esc(p.title)} · ${p.sections.length}개 섹션</div>`+p.sections.map((s,i)=>`<div class="pv-wire"><span class="pv-dot"></span><b>${secLabel(s)}</b><span class="pv-tag">${i===0?'맨 위':i===p.sections.length-1?'맨 아래':'중간'}</span></div>`).join('');
  mount.innerHTML='';mount.appendChild(nav);mount.appendChild(cv);
}
function foot(){return `<div class="footbar"><button class="act-ghost">${I.left} 이전</button><div style="display:flex;align-items:center;gap:14px"><span class="hint">저장하기=임시 저장 · 승인해야 다음 단계</span><button class="act-primary">이 구성으로 승인하기 ${I.arrow}</button></div></div>`;}
const st={sel:'fr-benefit',open:{},mode:'edit',onEye:()=>{st.mode='preview';}};tops().forEach(p=>st.open[p.id]=true);
const tree=document.getElementById('tree'),pv=document.getElementById('pv');
const paneEdit=document.getElementById('paneEdit'),panePrev=document.getElementById('panePrev');
const tabEdit=document.getElementById('tabEdit'),tabPrev=document.getElementById('tabPrev');
function render(focusId){
  renderTree(tree,st,render);
  if(st.mode==='preview')renderPreview(pv,st,render);
  paneEdit.classList.toggle('on',st.mode==='edit');panePrev.classList.toggle('on',st.mode==='preview');
  tabEdit.classList.toggle('on',st.mode==='edit');tabPrev.classList.toggle('on',st.mode==='preview');
  if(focusId&&st.mode==='edit'){const n=tree.querySelector('[data-id="'+focusId+'"] .tn');if(n){n.focus();selectText(n);}}
}
tabEdit.onclick=()=>{st.mode='edit';render();};tabPrev.onclick=()=>{st.mode='preview';render();};
document.getElementById('footmount').innerHTML=foot();
document.getElementById('themebtn').onclick=()=>{const r=document.documentElement,c=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',c==='dark'?'light':'dark');};
render();
</script>
